set -g default-terminal 'tmux-256color'
set -g mouse on
set -g status-position bottom
set -g status-left-length 45
set -g status-right-length 65
set -g status-interval 2
set -g escape-time 10
set -g pane-border-lines simple
set -g window-status-format ''
set -g window-status-current-format ''


set -g allow-passthrough on

# Open the visual picker from either the chat or the help pane.
bind -n F7 select-pane -t telegram:0.0 \; send-keys -t telegram:0.0 F7

bind -n C-l select-pane -t telegram:0.0 \; send-keys -t telegram:0.0 C-l

bind -n F4 select-pane -t telegram:0.0 \; send-keys -t telegram:0.0 F4
bind -n C-o select-pane -t telegram:0.0 \; send-keys -t telegram:0.0 C-o

# Native tmux image storage erases graphics with their pane.
set -as terminal-features ',xterm*:sixel'

bind -n C-g select-pane -t telegram:0.0 \; send-keys -t telegram:0.0 C-g
unbind -n F2
unbind -n F3
unbind -n F5
unbind -n F6
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down
bind -n F1 select-pane -t telegram:0.0 \; send-keys -t telegram:0.0 F1
bind -n C-t select-pane -t telegram:0.0 \; send-keys -t telegram:0.0 C-t
# Runtime injects Ctrl+Q with the installation-specific controller.
bind -n F8 display-message "Обновления устанавливаются через ttools; это не перезапуск."

# Stable application name in the terminal window/tab.
set -g set-titles on
set -g set-titles-string "Telegram · ttelegram"
set -g automatic-rename off
set -g allow-rename off
