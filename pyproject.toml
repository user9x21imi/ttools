[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ttools"
version = "1.1.0.dev4"
description = "Animated terminal launcher for your tools"
requires-python = ">=3.11"
dependencies = ["windows-curses>=2.4; sys_platform == 'win32'"]

[project.optional-dependencies]
docs = ["Pillow>=10.4", "python-xlib>=0.33; sys_platform == 'linux'"]

[project.scripts]
ttools = "ttools.__main__:main"

[tool.setuptools.package-data]
"ttools.visuals" = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["ttools*"]
