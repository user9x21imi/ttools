name: Test and release ttools
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release (requires author approval)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install launcher dependency
        run: python -m pip install -e .
      - name: Unit and terminal integration tests
        run: python -m unittest discover -s tests -v
      - name: Check macOS system certificates with empty Python trust store
        if: runner.os == 'macOS'
        run: python tests/smoke_macos_tls.py
      - name: Verify source Spotify dependencies without account or audio
        run: |
          python -m pip install ./components/tspotify/source
          python -m tspotify verify-runtime
      - name: Check portable tthings without UI
        shell: bash
        run: |
          python -m pip install ./components/tthings/source
          python -m tthings --version
          python -m tthings --effect stars --snapshot 64x18
      - name: Verify native Windows Telegram offline install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/download_windows_telegram.py
          $bundle = Resolve-Path components/ttelegram/runtime/windows-native
          python -m unittest discover -s "$bundle/tests" -v
          & "$bundle/bootstrap/python.exe" -c "import runpy,sys;runpy.run_path(sys.argv.pop(1),run_name='__main__')" "$bundle/manage.py" install --prefix "$env:RUNNER_TEMP/Telegram проверка с пробелами"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/Telegram проверка с пробелами/bootstrap/python.exe" -c "import runpy,sys;runpy.run_path(sys.argv.pop(1),run_name='__main__')" "$env:RUNNER_TEMP/Telegram проверка с пробелами/manage.py" doctor --prefix "$env:RUNNER_TEMP/Telegram проверка с пробелами"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows installer logic with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/test_install_ps1.ps1
      - name: Windows installer logic with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows/test_install_ps1.ps1
      - name: Preview platform installation plan
        run: python installer.py --plan --allow-partial
  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download pinned Linux Telegram dependencies
        run: python tools/download_wheels.py
      - name: Download verified Windows Telegram payload
        run: python tools/download_windows_telegram.py
      - name: Build verified platform archives
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ttools-release
          path: dist/*
  windows-installer-smoke:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: ttools-release
          path: ${{ runner.temp }}/ttools-release
      - name: Probe installed WinGet and Python on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows/test_live_dependencies.ps1
      - name: Physically install the verified Python.org fallback with PowerShell 7
        shell: pwsh
        run: ./tests/windows/test_live_dependencies.ps1 -InstallVerifiedPythonFallback
      - name: Install from release ZIP and PowerShell, verify state, launch and return
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ttools-release/ttools-windows-x86_64.zip'
          $package = Join-Path $env:RUNNER_TEMP 'TTools пакет с пробелами'
          $prefix = Join-Path $env:RUNNER_TEMP 'TTools установка с пробелами'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $packageRoot = Join-Path $package 'ttools'
          if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'Install-ttools.cmd') -PathType Leaf)) { throw 'Windows ZIP layout is missing ttools/Install-ttools.cmd.' }
          Push-Location $packageRoot
          $line = 'Install-ttools.cmd -Preview -Prefix "' + $prefix + '" -DeferSystem'
          $env:TTOOLS_INSTALLER_NO_PAUSE = '1'
          & $env:ComSpec /d /c $line
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $statePath = Join-Path $prefix 'state.json'
          if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { throw 'ZIP install did not create state.json.' }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath (Join-Path $prefix 'runner.py') -PathType Leaf)) { throw 'ZIP install did not create runner.py.' }
          $expectedApps = @('tspotify','ttelegram','tvpn','tthings')
          $catalog = Get-Content -LiteralPath (Join-Path $state.release 'apps.local.json') -Raw | ConvertFrom-Json
          $installedApps = @($catalog.apps | ForEach-Object { $_.id })
          foreach ($app in $expectedApps) {
            if ($installedApps -notcontains $app) { throw "The active Windows release does not include $app." }
          }
          $bundle = Get-Content -LiteralPath (Join-Path $state.release 'bundle.json') -Raw | ConvertFrom-Json
          if ($state.version -ne $bundle.version) { throw 'The active release does not match its bundle manifest.' }
          $sentinelPath = Join-Path $prefix 'user-data/qa-sentinel.json'
          New-Item -ItemType Directory -Path (Split-Path -Parent $sentinelPath) -Force | Out-Null
          Set-Content -LiteralPath $sentinelPath -Value '{"keep":"repeat-install"}' -NoNewline
          & $env:ComSpec /d /c $line
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content -LiteralPath $sentinelPath -Raw) -ne '{"keep":"repeat-install"}') { throw 'Repeat ZIP install changed user data.' }
          $env:TTOOLS_AUTOUPDATE = '0'
          $launcher = Join-Path $prefix 'bin/ttools.cmd'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'ZIP install did not create the ttools command shim.' }
          $apps = & $launcher --list | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($app in $expectedApps) {
            if ($apps -notmatch ('(?m)^' + [regex]::Escape($app) + '\s')) { throw "Installed launcher did not list $app." }
            & $launcher --app $app --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Launcher could not start and return from $app --help." }
            & $launcher --list | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Launcher did not return after $app." }
          }
          Pop-Location
          $remotePrefix = Join-Path $env:RUNNER_TEMP 'TTools удалённая установка'
          $candidateBootstrap = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/bootstrap.py"
          $env:TTOOLS_BOOTSTRAP_URL = $candidateBootstrap
          & (Join-Path $env:GITHUB_WORKSPACE 'install.ps1') -Preview -Prefix $remotePrefix -Components tthings
          Remove-Item Env:TTOOLS_BOOTSTRAP_URL
          $remoteLauncher = Join-Path $remotePrefix 'bin/ttools.cmd'
          if (-not (Test-Path -LiteralPath $remoteLauncher -PathType Leaf)) { throw 'PowerShell install did not create the ttools command shim.' }
          $remoteApps = & $remoteLauncher --list | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteApps -notmatch '(?m)^tthings\s') { throw 'PowerShell-installed launcher did not list tthings.' }
          & $remoteLauncher --app tthings --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $remoteLauncher --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Release ZIP and remote installs, repeat install, ttools launcher, and tthings launch all passed.'
  publish:
    # A versioned change merged to main becomes a public preview Release after
    # every check and platform package succeeds. Maintainers can also publish a
    # selected ref manually.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [package, windows-installer-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ttools-release
          path: dist
      - name: Publish preview after all checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'from ttools import __version__; print(__version__)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; immutable artifacts are preserved."
            exit 0
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "ttools $version" --notes-file docs/RELEASE.md --prerelease
